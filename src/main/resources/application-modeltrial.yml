# Explicit temporary local AI integration trial only; never changes normal integration defaults.
# Must be combined with integration and validated before datasource beans initialize.
server:
  address: 127.0.0.1
  port: 18081
spring:
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jpa:
    generate-ddl: false
ai:
  enabled: ${AI_LOCAL_TRIAL_CONFIRMED:false}
app:
  web:
    allowed-origins: http://127.0.0.1:15176,http://localhost:15176
  ai-trial:
    confirmed: ${AI_LOCAL_TRIAL_CONFIRMED:false}
