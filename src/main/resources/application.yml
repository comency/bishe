server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: campus-lost-found-ai
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:13306}/${DB_NAME:lost_found}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:lost_found_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      database: ${REDIS_DATABASE:0}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
ai:
  enabled: false
  base-url: https://api.openai.com/v1
  api-key: ${AI_API_KEY:}
  model: gpt-4o-mini
app:
  session-ttl-hours: 24
  admin-password: ${ADMIN_PASSWORD:}
  campus:
    campus-id: ${CAMPUS_ID:TEST_CAMPUS}
    timezone: Asia/Shanghai
    test-mode: ${CAMPUS_TEST_MODE:true}
